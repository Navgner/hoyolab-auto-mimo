name: HoYoLAB Auto Run

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Create Config File
        run: echo "$CONFIG_DATA" > config.json5
        env:
          CONFIG_DATA: ${{ secrets.CONFIG }}
      - run: node index.js --sign
